name: Learning problem
description: Report a problem that prevents or confuses completion of the lab.
title: "[Learning problem]: "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the lab. Do not include credentials,
        tokens, private endpoints, personal todo content, or other secrets.
  - type: dropdown
    id: profile
    attributes:
      label: Profile
      description: Which execution profile were you using?
      options:
        - Local (stdio)
        - Remote test (loopback HTTP)
        - Remote Azure Container Apps
        - Not sure
    validations:
      required: true
  - type: textarea
    id: step
    attributes:
      label: Step or command
      description: Identify the documentation section and sanitized command.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized error text when useful.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, tokens, private endpoints, personal data, and local paths.
          required: true
